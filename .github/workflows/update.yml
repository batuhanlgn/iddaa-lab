name: Güncelle ve yayınla

on:
  schedule:
    # 15 dakikada bir. Son tam güncellemenin üzerinden 3 saat geçtiyse tam güncelleme (refresh), diğerleri yaklaşan
    # maçların resmi kadroları ve güncel oranlarıyla yeniden tahmin (lineups). Canlı skor/oran ise tarayıcıda 20 sn'de bir.
    - cron: "7,22,37,52 * * * *"
    - cron: "37 2 * * 1"   # haftalık backtest (ayrı zamanlama: gecikse de atlanmaz)
  workflow_dispatch:
    inputs:
      job:
        description: "Çalıştırılacak iş"
        type: choice
        options: [auto, refresh, lineups, odds, backtest]
        default: auto
      delay:
        description: "Başlamadan önce bekleme (sn) — yedek zincir için"
        required: false
        default: "0"

permissions:
  contents: write   # veritabanını Release'e yükle
  pages: write
  id-token: write
  actions: write    # zamanlanmış çalışmayı canlı tut

concurrency:
  group: iddaa-lab-update
  cancel-in-progress: false

env:
  DATA_TAG: data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      # Yedek zincir: GitHub zamanlayıcısı tetiklenmezse bir önceki çalışma bu çalışmayı gecikmeli başlatır
      - name: Zincir beklemesi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.delay != '' && inputs.delay != '0' }}
        run: sleep ${{ inputs.delay }}

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python bağımlılıkları
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements.txt

      # Veritabanı önce önbellekten (hızlı), yoksa Release yedeğinden
      - name: Veritabanı önbelleği
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: data/iddaa_lab.sqlite3
          key: db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: db-

      - name: Veritabanını indir (Release yedeği)
        run: |
          mkdir -p data
          if [ -f data/iddaa_lab.sqlite3 ]; then
            echo "Önbellekten geldi"
            echo "HAVE_DB=1" >> "$GITHUB_ENV"
          elif gh release download "$DATA_TAG" --pattern "iddaa_lab.sqlite3.gz" --dir data; then
            gunzip -f data/iddaa_lab.sqlite3.gz
            echo "HAVE_DB=1" >> "$GITHUB_ENV"
          else
            echo "Veritabanı yok: ilk kurulum yapılacak"
            echo "HAVE_DB=0" >> "$GITHUB_ENV"
          fi

      - name: Çalıştırılacak işi seç
        id: pick
        run: |
          # Tam güncelleme saate değil son başarılı tam güncellemenin yaşına göre (zincir saatleri kaydırabilir)
          AGE=$(python3 -c "import sqlite3,datetime as d; c=sqlite3.connect('data/iddaa_lab.sqlite3'); r=c.execute(\"select max(finished_at) from job_runs where job in ('refresh','bootstrap') and status='ok'\").fetchone()[0]; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(r.replace('Z','+00:00'))).total_seconds()) if r else 999999)" 2>/dev/null || echo 999999)
          echo "Son tam güncelleme $AGE sn önce"
          if [ "$HAVE_DB" != "1" ]; then
            echo "jobs=bootstrap" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.job }}" != "auto" ]; then
            echo "jobs=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 2 * * 1" ]; then
            echo "jobs=backtest refresh" >> "$GITHUB_OUTPUT"
          elif [ "$AGE" -ge 10800 ]; then
            echo "jobs=refresh" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lineups" >> "$GITHUB_OUTPUT"
          fi
          echo "Seçilen işler: $(grep '^jobs=' "$GITHUB_OUTPUT" | tail -1)"

      - name: Model ve tahminler
        working-directory: backend
        run: |
          for j in ${{ steps.pick.outputs.jobs }}; do
            echo "::group::$j"
            .venv/bin/python -m app.jobs "$j"
            echo "::endgroup::"
          done

      - name: Veritabanını kapat (WAL birleştir)
        if: ${{ !cancelled() && hashFiles('data/iddaa_lab.sqlite3') != '' }}
        run: python3 -c "import sqlite3; c=sqlite3.connect('data/iddaa_lab.sqlite3'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: Veritabanı önbelleğini kaydet
        if: ${{ !cancelled() && hashFiles('data/iddaa_lab.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/iddaa_lab.sqlite3
          key: db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Veritabanını yedekle (Release)
        if: ${{ !cancelled() && hashFiles('data/iddaa_lab.sqlite3') != '' && (contains(steps.pick.outputs.jobs, 'refresh') || contains(steps.pick.outputs.jobs, 'bootstrap') || contains(steps.pick.outputs.jobs, 'backtest')) }}
        run: |
          gzip -kf data/iddaa_lab.sqlite3
          gh release view "$DATA_TAG" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" --title "Veri" --notes "GitHub Actions tarafından otomatik güncellenen veritabanı."
          gh release upload "$DATA_TAG" data/iddaa_lab.sqlite3.gz --clobber

      - name: Statik veriyi dışa aktar
        working-directory: backend
        run: .venv/bin/python -m app.export_static ../web/static-data

      - name: Siteyi derle
        working-directory: web
        env:
          IDDAA_STATIC_DIR: static-data
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          rm -rf app/api   # yerel arka uç proxy'si statik sitede yok
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Zamanlanmış çalışmayı canlı tut
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      # GitHub zamanlayıcısı son 50 dakikada tetiklenmediyse ve sırada başka çalışma yoksa bir sonrakini
      # 25 dk gecikmeyle başlat (≈30 dk döngü). Zamanlayıcı çalışmaya başlayınca zincir kendiliğinden durur.
      - name: Yedek zincir
        if: ${{ always() }}
        continue-on-error: true
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/actions/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // ""')
          NOW=$(date -u +%s)
          if [ -n "$LAST" ] && [ $(( NOW - $(date -u -d "$LAST" +%s) )) -lt 1800 ]; then
            echo "Zamanlayıcı çalışıyor (son: $LAST); zincir gerekmiyor"; exit 0
          fi
          OTHERS=$(gh run list --repo "${{ github.repository }}" --workflow update.yml --limit 20 --json status,databaseId             --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$OTHERS" != "0" ]; then echo "Sırada başka çalışma var ($OTHERS); zincir başlatılmadı"; exit 0; fi
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main -f job=auto -f delay=600
          echo "Zamanlayıcı tetiklenmiyor (son: ${LAST:-hiç}); sonraki çalışma 10 dk sonra başlayacak (≈15 dk döngü)"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
